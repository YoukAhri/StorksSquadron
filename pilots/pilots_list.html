<script>
const container = document.getElementById("pilots"); // ищиет pilots выше в коде

pilots.forEach(pilot => { // для каждого пилот 
  const card = document.createElement("div"); // создаёт новый див 
  card.className = "pilot-card"; // переименовывает его в пилот-карт

  // вставка html в элемент
  card.innerHTML = `
    <div class="block-avatar-name">
      <div class="block-name">
        <span class="pilot-nick">${pilot.nick}</span>
        <span class="pilot-name">${pilot.name}</span>
        <span class="pilot-number">${pilot.number}</span>
      </div>
      <img src="${pilot.avatar}">
    </div>

    <hr>

    <div class="date-join">
      <div class="">
        <span data-key="joindate"></span> 
        <span></br>${pilot.joinDate}</span>
      </div>
      <span>${pilot.rank}</span>
    </div>

    <hr>

    <div class="plane-list">
      ${pilot.planes.map(p => `<span>${p}</span>`).join("")}
    </div>

    <div class="role">
      <span>${pilot.role}</span>
      <img src="${pilot.flag}" style="width:25px;height:25px">
    </div>
  `;


  container.appendChild(card); // из дум вставляю его в html код 
});
</script>
